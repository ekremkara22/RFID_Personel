server {
    listen 80;
    listen [::]:80;
    server_name test.flodeska.com;

    # Product image uploads send up to 5 x 2 MB in one Server Action (next.config.ts bodySizeLimit 12mb).
    client_max_body_size 12m;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Real client IP only: the register rate limit reads the first X-Forwarded-For value.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
